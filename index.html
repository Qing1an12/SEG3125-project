<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="portfolio-home position-relative" style="margin: 0; padding: 0; overflow-x: hidden;">

    <!-- Vertical Light Yellow Bar -->
    <div class="position-fixed top-0 start-0" style="width: 35px; height: 80vh; background-color: rgb(209, 255, 130); z-index: 2;"></div>
    
    <div class="position-absolute top-0 start-0 p-4 p-md-5" style="width: 35%; z-index: 10;">
        <p id="about-me-text" class="typewriter-text"></p>
    </div>

    <div class="d-flex flex-column align-items-center vh-100 w-100" style="z-index: 5; position: relative;">
        
        <div class="w-100 text-center mt-5" style="position: relative; z-index: 5;">
            
            <!-- Flexbox to center the content -->
            <div class="d-flex justify-content-center mb-3">
                <a href="index.html" class="position-relative d-inline-block text-decoration-none">
                    <img src="resources/pattern.png" alt="Home Button" class="img-fluid" style="max-width: 100px; height: auto;">
                </a>
            </div>
            <h1 class="text-gray custom-title-font mb-1 p-2 d-inline-block" style="font-size: 1.8rem; background-color: rgb(222, 255, 55); box-shadow: 0 0 20px 15px lightyellow; border-radius: 8px;">You landed on Lucy's portfolio.</h1>
            
        </div>

        <a class="mt-auto w-50 d-flex justify-content-center" style="margin-bottom: 0;">
            <img src="resources/Lanita_transparent.png" alt="Portfolio Graphic" class="img-fluid d-block" style="margin-bottom: 0;">
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const speed = 10;
            let index = 0;
            const targetElement = document.getElementById("about-me-text");

            fetch('story.txt')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text();
                })
                .then(aboutText => {
                    function typeWriter() {
                        if (index < aboutText.length) {
                            targetElement.innerHTML += aboutText.charAt(index);
                            index++;
                            setTimeout(typeWriter, speed);
                        }
                    }
                    typeWriter();
                })
                .catch(error => {
                    console.error('Error loading story.txt:', error);
                    targetElement.innerHTML = "Error loading 'About Me' text.";
                });
        });
    </script>

    <div class="position-fixed top-50 end-0 translate-middle-y p-4 p-md-5 d-flex flex-column align-items-end" style="z-index: 20;">
        <a href="service.html" class="sticky-note note-1 d-flex align-items-center text-decoration-none">
            <span class="small-desc me-3">01. <br>Service</span>
            <img src="resources/service.png" alt="Service Site Case Study">
        </a>
        <a href="memory.html" class="sticky-note note-2 d-flex align-items-center text-decoration-none">
            <span class="small-desc me-3">02. <br>Memory Game</span>
            <img src="resources/memory.png" alt="Memory Game Case Study">
        </a>
        <a href="ecommerce.html" class="sticky-note note-3 d-flex align-items-center text-decoration-none">
            <span class="small-desc me-3">03. <br>E-Commerce</span>
            <img src="resources/ecommerce.png" alt="E-Commerce Case Study">
        </a>
        <a href="analytics.html" class="sticky-note note-4 d-flex align-items-center text-decoration-none">
            <span class="small-desc me-3">04. <br>Analytics</span>
            <img src="resources/analytics.png" alt="Analytics Case Study">
        </a>
    </div>
</body>
</html>
